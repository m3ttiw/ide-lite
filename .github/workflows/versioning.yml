name: Versioning

# On every push to main, semantic-release decides whether the commits since the
# last v* tag deserve a release. When they do, it commits
# "chore(release): X.Y.Z" (package.json, package-lock.json, CHANGELOG.md),
# tags vX.Y.Z and pushes both. A tag pushed with GITHUB_TOKEN does not trigger
# other workflows, so release.yml is dispatched explicitly on that tag.

on:
  push:
    branches: [main]

permissions:
  contents: write # push the release commit and tag
  actions: write # dispatch release.yml

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Mattia Patruno
          GIT_AUTHOR_EMAIL: m3ttiw@gmail.com
          GIT_COMMITTER_NAME: Mattia Patruno
          GIT_COMMITTER_EMAIL: m3ttiw@gmail.com
        run: npx semantic-release

      - name: Dispatch the release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          release_commit="$(git rev-parse origin/main)"
          if [[ "$release_commit" == "$GITHUB_SHA" ]]; then
            echo "No release commit was created."
            exit 0
          fi
          tag="$(git tag --points-at "$release_commit" --list 'v*.*.*' --sort=-version:refname | head -n 1)"
          if [[ -z "$tag" ]]; then
            echo "The release commit has no version tag." >&2
            exit 1
          fi
          gh workflow run release.yml --ref "$tag"
          echo "Dispatched release.yml on $tag"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run release:check
      - run: npm test
      # Type check + frontend build; also needed by generate_context!() below.
      - run: npm run build

      - name: Backend tests and lints
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
